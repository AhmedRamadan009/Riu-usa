<!DOCTYPE html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/favicon.jpg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="جامعة ربانيين العالمية — منصة أكاديمية متكاملة للقبول والتسجيل والدراسة" />
    <meta name="theme-color" content="#135d6c" />
    <title>RIU | Rabbaninen Islamic University |Main branch</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@200..1000&family=Cinzel:wght@400..900&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script>
      (() => {
        const isLocal = ['localhost', '127.0.0.1'].includes(window.location.hostname);
        if (!isLocal) return;

        const projectRef = 'ygqyhzkjjukydfcxkzfx';
        const projectAuthKey = `sb-${projectRef}-auth-token`;

        for (let index = localStorage.length - 1; index >= 0; index -= 1) {
          const key = localStorage.key(index);
          if (key?.startsWith('sb-') && key.endsWith('-auth-token') && key !== projectAuthKey) {
            localStorage.removeItem(key);
          }
        }

        const storedSession = localStorage.getItem(projectAuthKey);
        if (!storedSession) return;

        try {
          const accessToken = JSON.parse(storedSession)?.access_token;
          const encodedPayload = accessToken?.split('.')[1];
          if (!encodedPayload) throw new Error('Invalid Supabase session');

          const normalizedPayload = encodedPayload.replace(/-/g, '+').replace(/_/g, '/');
          const padding = '='.repeat((4 - (normalizedPayload.length % 4)) % 4);
          const payload = JSON.parse(atob(normalizedPayload + padding));

          if (payload.ref !== projectRef || payload.exp * 1000 <= Date.now()) {
            localStorage.removeItem(projectAuthKey);
          }
        } catch {
          localStorage.removeItem(projectAuthKey);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
